<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - PeerLearn</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="app-main">
      <!-- Topbar -->
      <div id="topbar-container"></div>

      <!-- Main Page Content -->
      <div class="page-container">
        <div class="page-header">
          <div class="page-title-group">
            <h1 id="pageTitle">Browse Academic Courses</h1>
            <p class="page-subtitle" id="pageSubtitle">
              Discover peer-reviewed learning paths in Web Development, Python, AI, Data Structures & Design.
            </p>
          </div>
        </div>

        <!-- Filter & Search Controls Bar -->
        <div class="filter-bar">
          <div class="pills-group" id="categoryFilters">
            <button class="filter-pill active" data-category="all">All Courses</button>
            <button class="filter-pill" data-category="Web Development">Web Development</button>
            <button class="filter-pill" data-category="Python">Python</button>
            <button class="filter-pill" data-category="Artificial Intelligence">AI & Data</button>
            <button class="filter-pill" data-category="Data Structures">Data Structures</button>
            <button class="filter-pill" data-category="JavaScript">JavaScript</button>
            <button class="filter-pill" data-category="Design Thinking">Design Thinking</button>
          </div>

          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <input type="text" id="courseSearch" class="form-control" placeholder="Search title or instructor..." style="width: 220px;">
            
            <select id="difficultyFilter" class="form-control" style="width: 140px;">
              <option value="all">All Levels</option>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>

            <select id="sortFilter" class="form-control" style="width: 140px;">
              <option value="popular">Most Popular</option>
              <option value="rating">Top Rated</option>
              <option value="title">Course A-Z</option>
            </select>
          </div>
        </div>

        <!-- Courses Grid Container -->
        <div class="grid-3" id="coursesGrid">
          <!-- Rendered by courses.js -->
        </div>

        <!-- Empty State -->
        <div id="coursesEmptyState" class="empty-state" style="display: none;">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <h3 class="empty-state-title">No Courses Match Your Criteria</h3>
          <p class="empty-state-desc">Try clearing your search query or selecting a different category filter.</p>
          <button class="btn btn-primary" onclick="window.location.href='courses.html'">Reset Filters</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/courses.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCoursesPage();
    });
  </script>
</body>
</html>
