<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PeerLearn</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar Mounted by App Shell -->
    <div id="sidebar-container"></div>

    <main class="app-main">
      <!-- Topbar Mounted by App Shell -->
      <div id="topbar-container"></div>

      <!-- Main Dashboard Page Body -->
      <div class="page-container" id="dashboardContent">
        <!-- Content injected dynamically by renderDashboard() -->
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth();
      if (!user) return;

      renderAppShell('dashboard');
      renderDashboard(user);
    });

    function renderDashboard(user) {
      const container = document.getElementById('dashboardContent');
      if (!container) return;

      // Fetch dynamic state from localStorage
      const courses = getData(STORAGE_KEYS.COURSES, []);
      const enrollments = getData(STORAGE_KEYS.ENROLLMENTS, []).filter(e => e.userId === user.id);
      const allLessons = getData(STORAGE_KEYS.LESSONS, []);
      const assignments = getData(STORAGE_KEYS.ASSIGNMENTS, []);
      const submissions = getData(STORAGE_KEYS.SUBMISSIONS, []);
      const mySubmissions = submissions.filter(s => s.studentId === user.id);
      const reviews = getData(STORAGE_KEYS.REVIEWS, []);
      const notifs = getData(STORAGE_KEYS.NOTIFICATIONS, []).filter(n => n.userId === user.id);

      // Calculations
      const totalEnrolled = enrollments.length;
      const completedCourses = enrollments.filter(e => e.completed).length;

      // Pending assignments (assignments in enrolled courses that student has NOT submitted yet)
      const enrolledCourseIds = enrollments.map(e => e.courseId);
      const relevantAssignments = assignments.filter(a => enrolledCourseIds.includes(a.courseId));
      const pendingAssignmentsCount = relevantAssignments.filter(a => !mySubmissions.some(s => s.assignmentId === a.id)).length;

      // Pending peer reviews assigned to this user
      const pendingReviews = submissions.filter(s => s.assignedReviewerId === user.id && s.status === 'under_review');
      const completedReviewsCount = reviews.filter(r => r.reviewerId === user.id).length;
      const overallProgress = calculateOverallProgress(user.id);

      container.innerHTML = `
        <!-- Welcome Hero Banner -->
        <div style="background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #7c3aed 100%); border-radius: var(--radius-xl); padding: 2.25rem; color: #fff; margin-bottom: 2rem; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; position: relative; overflow: hidden;">
          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <img src="${user.avatar}" alt="${user.name}" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);">
            <div>
              <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                <span class="role-badge role-${user.role}" style="background: rgba(255, 255, 255, 0.2); color: #fff; backdrop-filter: blur(8px);">
                  ● ${user.role.toUpperCase()}
                </span>
                <span style="font-size: 0.8rem; color: #bfdbfe;">Active Semester</span>
              </div>
              <h1 style="font-size: 2rem; color: #fff; margin-bottom: 0.2rem;">Welcome back, ${user.name}!</h1>
              <p style="font-size: 0.95rem; color: #e0e7ff; max-width: 550px;">
                You have <strong>${pendingReviews.length} peer reviews</strong> awaiting evaluation and <strong>${pendingAssignmentsCount} pending assignments</strong>.
              </p>
            </div>
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <a href="courses.html" class="btn btn-secondary btn-sm" style="font-weight: 700;">+ Browse Courses</a>
            <a href="reviews.html" class="btn btn-purple btn-sm">View Reviews (${pendingReviews.length})</a>
          </div>
        </div>

        <!-- 3D Stat Cards Grid -->
        <div class="grid-4" style="margin-bottom: 2rem;">
          <!-- 1. Enrolled Courses -->
          <div class="stat-card-3d">
            <div class="stat-info">
              <span class="stat-label">Enrolled Courses</span>
              <span class="stat-value">${totalEnrolled}</span>
              <span class="stat-trend trend-up">${completedCourses} Completed</span>
            </div>
            <div class="stat-icon-wrapper stat-icon-blue">
              ${ICONS.myCourses}
            </div>
          </div>

          <!-- 2. Pending Assignments -->
          <div class="stat-card-3d">
            <div class="stat-info">
              <span class="stat-label">Pending Tasks</span>
              <span class="stat-value">${pendingAssignmentsCount}</span>
              <span class="stat-trend ${pendingAssignmentsCount > 0 ? 'trend-down' : 'trend-up'}">
                ${pendingAssignmentsCount > 0 ? 'Due soon' : 'All caught up!'}
              </span>
            </div>
            <div class="stat-icon-wrapper stat-icon-purple">
              ${ICONS.assignments}
            </div>
          </div>

          <!-- 3. Pending Peer Reviews -->
          <div class="stat-card-3d">
            <div class="stat-info">
              <span class="stat-label">Pending Reviews</span>
              <span class="stat-value">${pendingReviews.length}</span>
              <span class="stat-trend ${pendingReviews.length > 0 ? 'trend-down' : 'trend-up'}">
                ${pendingReviews.length > 0 ? 'Action required' : 'Queue clear'}
              </span>
            </div>
            <div class="stat-icon-wrapper stat-icon-amber">
              ${ICONS.reviews}
            </div>
          </div>

          <!-- 4. Overall Progress -->
          <div class="stat-card-3d">
            <div class="stat-info">
              <span class="stat-label">Overall Progress</span>
              <span class="stat-value">${overallProgress}%</span>
              <span class="stat-trend trend-up">${completedReviewsCount} Reviews Completed</span>
            </div>
            <div class="stat-icon-wrapper stat-icon-emerald">
              ${ICONS.progress}
            </div>
          </div>
        </div>

        <!-- Main Dashboard Split Layout -->
        <div class="grid-dashboard">
          <!-- Left Column -->
          <div>
            <!-- Section: My Active Courses -->
            <div class="card-3d" style="margin-bottom: 1.5rem;">
              <div class="card-header">
                <div>
                  <h3 class="card-title">My Courses</h3>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Your enrolled curriculum tracks</div>
                </div>
                <a href="courses.html?filter=enrolled" style="font-size: 0.85rem; font-weight: 700;">View All →</a>
              </div>

              ${enrollments.length === 0 ? `
                <div class="empty-state" style="padding: 2rem 1rem;">
                  <p style="color: var(--text-muted); margin-bottom: 1rem;">You haven't enrolled in any courses yet.</p>
                  <a href="courses.html" class="btn btn-primary btn-sm">Explore Courses</a>
                </div>
              ` : `
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                  ${enrollments.slice(0, 3).map(enr => {
                    const c = courses.find(course => course.id === enr.courseId);
                    if (!c) return '';
                    const progress = calculateCourseProgress(user.id, c.id);

                    return `
                      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: #ffffff; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); flex-wrap: wrap; gap: 1rem;">
                        <div style="flex: 1; min-width: 220px;">
                          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                            <span class="role-badge role-student" style="font-size: 0.7rem;">${c.category}</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted);">Instructor: ${c.instructor}</span>
                          </div>
                          <h4 style="font-size: 1.05rem; color: var(--text-main); margin-bottom: 0.4rem;">
                            <a href="content.html?courseId=${c.id}">${c.title}</a>
                          </h4>
                          
                          <div class="progress-bar-container" style="margin: 0.35rem 0 0;">
                            <div class="progress-header">
                              <span style="font-size: 0.75rem;">Completion</span>
                              <span style="font-weight: 700; color: var(--primary-600);">${progress}%</span>
                            </div>
                            <div class="progress-track">
                              <div class="progress-fill" style="width: ${progress}%;"></div>
                            </div>
                          </div>
                        </div>

                        <div>
                          <a href="content.html?courseId=${c.id}" class="btn btn-primary btn-sm">
                            Continue
                          </a>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- Section: Pending Peer Reviews Assigned -->
            <div class="card-3d">
              <div class="card-header">
                <div>
                  <h3 class="card-title">Pending Peer Reviews</h3>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Submissions awaiting your feedback</div>
                </div>
                <a href="reviews.html" style="font-size: 0.85rem; font-weight: 700;">All Reviews (${pendingReviews.length}) →</a>
              </div>

              ${pendingReviews.length === 0 ? `
                <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-md); padding: 1.5rem; text-align: center; color: #166534; font-size: 0.9rem;">
                  🎉 You have completed all assigned peer reviews! Outstanding contribution.
                </div>
              ` : `
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                  ${pendingReviews.map(sub => `
                    <div style="padding: 1rem 1.25rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: #f8fafc; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;">
                      <div>
                        <span class="role-badge role-reviewer" style="font-size: 0.7rem; margin-bottom: 0.25rem;">Action Needed</span>
                        <h4 style="font-size: 1rem; color: var(--text-main); margin-top: 0.2rem;">${sub.assignmentTitle}</h4>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">
                          Student: <strong>${sub.studentName}</strong> • Submitted: ${formatDate(sub.submittedAt)}
                        </div>
                      </div>

                      <a href="review-details.html?submissionId=${sub.id}" class="btn btn-primary btn-sm">
                        Start Review →
                      </a>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>

          <!-- Right Column -->
          <div>
            <!-- Section: Recent Notifications -->
            <div class="card-3d" style="margin-bottom: 1.5rem;">
              <div class="card-header">
                <h3 class="card-title">Latest Notifications</h3>
                <a href="notifications.html" style="font-size: 0.82rem; font-weight: 700;">View All</a>
              </div>

              <div style="display: flex; flex-direction: column; gap: 0.65rem;">
                ${notifs.slice(0, 4).map(n => `
                  <div style="padding: 0.75rem 0.85rem; border-radius: var(--radius-md); background: ${n.read ? '#f8fafc' : '#eff6ff'}; border: 1px solid ${n.read ? 'transparent' : '#bfdbfe'};">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem;">
                      <strong style="font-size: 0.85rem; color: var(--text-main);">${n.title}</strong>
                      <span style="font-size: 0.7rem; color: var(--text-muted);">${formatRelativeTime(n.createdAt)}</span>
                    </div>
                    <p style="font-size: 0.8rem; color: var(--text-body);">${n.message}</p>
                    ${n.link && n.link !== '#' ? `<a href="${n.link}" style="font-size: 0.75rem; font-weight: 700; color: var(--primary-600); margin-top: 0.25rem; display: inline-block;">View Item →</a>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Section: Recent Activity Timeline -->
            <div class="card-3d">
              <h3 class="card-title" style="margin-bottom: 1.25rem;">Recent Activity</h3>

              <div class="timeline">
                <div class="timeline-item">
                  <div class="timeline-dot"></div>
                  <div class="timeline-content">
                    <div class="timeline-header">
                      <span class="timeline-title">Peer Review Assigned</span>
                      <span class="timeline-time">Recently</span>
                    </div>
                    <p class="timeline-desc">Assigned to review Emily Watson's 3D SaaS portfolio showcase.</p>
                  </div>
                </div>

                <div class="timeline-item">
                  <div class="timeline-dot purple"></div>
                  <div class="timeline-content">
                    <div class="timeline-header">
                      <span class="timeline-title">Feedback Received</span>
                      <span class="timeline-time">2 days ago</span>
                    </div>
                    <p class="timeline-desc">Dr. Sarah Chen gave your client dashboard a 5-star rating.</p>
                  </div>
                </div>

                <div class="timeline-item">
                  <div class="timeline-dot emerald"></div>
                  <div class="timeline-content">
                    <div class="timeline-header">
                      <span class="timeline-title">Course Enrolled</span>
                      <span class="timeline-time">Last week</span>
                    </div>
                    <p class="timeline-desc">Enrolled in Modern Full-Stack Web Development.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
